<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 0; background: white; }
  .frame { width: 512px; height: 512px; display: flex; align-items: center; justify-content: center; background: white; }
  img { width: 400px; height: 400px; object-fit: contain; }
</style>
</head>
<body>
<div class="frame" id="container">
  <img id="svgimg" src="everyday-theo.svg"/>
</div>
<canvas id="canvas" width="512" height="512" style="display:none"></canvas>
<script>
  const img = document.getElementById('svgimg');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  img.onload = function() {
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, 512, 512);
    ctx.drawImage(img, 56, 56, 400, 400);
    const dataURL = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = dataURL;
    a.download = 'theo-png.png';
    a.click();
  };
</script>
</body>
</html>
